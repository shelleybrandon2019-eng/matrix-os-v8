<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Matrix OS // Live</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#9f9;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;text-shadow:0 0 8px #00ff66,0 0 20px #00aa44}.clock{margin-top:7vh;font-size:clamp(54px,14vw,150px);font-weight:900;letter-spacing:.04em}.date{font-size:clamp(14px,3vw,26px);opacity:.75}.temps{margin-top:auto;margin-bottom:8vh;display:flex;gap:8vw;font-size:clamp(18px,4vw,34px);font-weight:700}.tag{position:fixed;left:14px;bottom:12px;font-size:11px;opacity:.45;letter-spacing:.18em}</style></head><body><canvas id="matrix"></canvas><div class="hud"><div class="clock" id="clock"></div><div class="date" id="date"></div><div class="temps"><span>INSIDE&nbsp;--°F</span><span>OUTSIDE&nbsp;--°F</span></div></div><div class="tag">MATRIX OS // REMOTE VIEW</div><script>const c=document.getElementById('matrix'),x=c.getContext('2d');let w,h,cols,drops;const chars='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜ0123456789';function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cols=Math.ceil(innerWidth/16);drops=Array(cols).fill(0).map(()=>Math.random()*-80)}resize();addEventListener('resize',resize);function rain(){x.fillStyle='rgba(0,0,0,.09)';x.fillRect(0,0,innerWidth,innerHeight);x.font='bold 16px monospace';for(let i=0;i<cols;i++){const ch=chars[Math.floor(Math.random()*chars.length)],y=drops[i]*16;x.fillStyle=Math.random()>.96?'#d8ffe4':Math.random()>.7?'#36ff79':'#00b84a';x.fillText(ch,i*16,y);if(y>innerHeight&&Math.random()>.965)drops[i]=0;drops[i]+=.65+Math.random()*.55}requestAnimationFrame(rain)}function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}).toUpperCase()}tick();setInterval(tick,1000);rain();</script></body></html>
